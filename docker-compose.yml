# Kestrel — local dev stack. Container-first (ADR/goal): everything runs here.
# Reachable only on the local host in dev; production sits behind Caddy + Tailscale.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kestrel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kestrel_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-kestrel}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kestrel} -d ${POSTGRES_DB:-kestrel}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      KESTREL_ENV: ${KESTREL_ENV:-dev}
      KESTREL_LOG_LEVEL: ${KESTREL_LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kestrel}
      POSTGRES_USER: ${POSTGRES_USER:-kestrel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kestrel_dev_only_change_me}
      APP_DB_USER: ${APP_DB_USER:-kestrel_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-kestrel_app_dev_only_change_me}
      KESTREL_DEFAULT_BASE_CURRENCY: ${KESTREL_DEFAULT_BASE_CURRENCY:-USD}
      KESTREL_SECRET_KEY_FILE: /run/secrets/kestrel_secret_key
    secrets:
      - kestrel_secret_key
    volumes:
      - ./backend:/app        # live reload in dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    # The worker serves no HTTP port, so the image's /healthz healthcheck
    # (meant for the api) would wrongly mark it unhealthy. Disable it here.
    healthcheck:
      disable: true
    environment:
      KESTREL_ENV: ${KESTREL_ENV:-dev}
      KESTREL_LOG_LEVEL: ${KESTREL_LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kestrel}
      POSTGRES_USER: ${POSTGRES_USER:-kestrel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kestrel_dev_only_change_me}
      APP_DB_USER: ${APP_DB_USER:-kestrel_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-kestrel_app_dev_only_change_me}
      KESTREL_SECRET_KEY_FILE: /run/secrets/kestrel_secret_key
    secrets:
      - kestrel_secret_key
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep container's installed deps

secrets:
  kestrel_secret_key:
    file: ./secrets/kestrel_secret_key

volumes:
  db_data:

# MetalMark — local dev stack. Container-first (ADR/goal): everything runs here.
# Reachable only on the local host in dev; production sits behind Caddy + Tailscale.
#
# The project name is pinned so the compose network (metalmark_default) and the
# playbook that joins it do not depend on the checkout's directory name.
name: metalmark

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metalmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metalmark_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-metalmark}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metalmark} -d ${POSTGRES_DB:-metalmark}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      METALMARK_ENV: ${METALMARK_ENV:-dev}
      METALMARK_LOG_LEVEL: ${METALMARK_LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-metalmark}
      POSTGRES_USER: ${POSTGRES_USER:-metalmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metalmark_dev_only_change_me}
      APP_DB_USER: ${APP_DB_USER:-metalmark_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-metalmark_app_dev_only_change_me}
      METALMARK_DEFAULT_BASE_CURRENCY: ${METALMARK_DEFAULT_BASE_CURRENCY:-USD}
      # `auto` derives the cookie's `Secure` flag from METALMARK_ENV, which is
      # `dev` here — so this stack behaves as it always has. The variable exists
      # for deployments on a private network with no TLS (ADR-0042); it is passed
      # through here too so that `.env.example` does not describe a setting this
      # stack ignores.
      METALMARK_SESSION_COOKIE_SECURE: ${METALMARK_SESSION_COOKIE_SECURE:-auto}
      METALMARK_SECRET_KEY_FILE: /run/secrets/metalmark_secret_key
      # Which provider the *claim* endpoint uses. Only the claim: an existing
      # connection carries its provider on its own row, so the worker dispatches
      # on that and does not read this. Defaults to the real one — the fake is a
      # deliberate opt-in, refused outright when METALMARK_ENV is not test/dev.
      METALMARK_SIMPLEFIN_PROVIDER: ${METALMARK_SIMPLEFIN_PROVIDER:-simplefin}
    secrets:
      - metalmark_secret_key
    volumes:
      - ./backend:/app        # live reload in dev
      # The repo's scripts, at the path CI mounts them. backup.sh/restore.sh run
      # the crypto as `exec -T api python /scripts/backup.py` rather than
      # starting a second container, and backend/tests/unit/test_backup_crypto.py
      # imports the file from here — without this mount a plain `pytest` in this
      # container cannot see scripts/ at all, since only backend/ is mounted.
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    # The worker serves no HTTP port, so the image's /healthz healthcheck
    # (meant for the api) would wrongly mark it unhealthy. Disable it here.
    healthcheck:
      disable: true
    # A worker that dies is silent, which is the one thing sync must never be:
    # the api keeps serving, the panel keeps drawing, "Sync now" keeps accepting,
    # and no job is ever consumed again. `wait_for_database` handles the ordinary
    # reason it would exit (a database that is not migrated yet); this covers
    # everything else. The api deliberately does *not* get a policy — an api that
    # is gone fails the next request, which needs no restart to be noticed.
    restart: unless-stopped
    environment:
      METALMARK_ENV: ${METALMARK_ENV:-dev}
      METALMARK_LOG_LEVEL: ${METALMARK_LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-metalmark}
      POSTGRES_USER: ${POSTGRES_USER:-metalmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metalmark_dev_only_change_me}
      APP_DB_USER: ${APP_DB_USER:-metalmark_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-metalmark_app_dev_only_change_me}
      METALMARK_SECRET_KEY_FILE: /run/secrets/metalmark_secret_key
    secrets:
      - metalmark_secret_key
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      # Stated, not defaulted, and it has to stay that way. Docker builds the
      # *last* stage of a Dockerfile when no target is given, and the production
      # deployment is the last one — so without this line `docker compose up -d
      # --build` (the command in the README, in CI, and in the `reset` gate) would
      # quietly replace the dev server with the deployment image: nginx listening
      # on 8080 while the service publishes 5173, and nothing answering at all.
      # deploy/docker-compose.yaml states `target: prod` in its turn.
      target: dev
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep container's installed deps

secrets:
  metalmark_secret_key:
    file: ./secrets/metalmark_secret_key

volumes:
  db_data:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Rewritten by src/theme/theme.ts once the choice is known; this is the
         pre-JS value. Light, because `:root` in index.css is light — there is
         deliberately no `class="dark"` here, which is what made light mode
         unreachable before: the class outranked every `:root` value, so the
         light palette was defined and never once painted. -->
    <meta name="theme-color" content="#f8fafc" />
    <!-- iOS reads these two for "Add to Home Screen" independently of the
         manifest's `display: "standalone"`. `default` keeps the status bar
         opaque and reserving its own space — the header does not need to
         paint under it. We deliberately do not set `black-translucent`: that
         mode extends content under the status bar and would require the
         header to carry `padding-top: env(safe-area-inset-top)` in both
         themes to avoid the clock/battery glyphs sitting on top of it. Not
         worth the risk for a change this task didn't ask for; if the app ever
         wants the immersive look, that inset goes on the header at the same
         time as this value flips. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The metalmark (Riodinidae). Order matters: Safari picks the first icon
         it understands, Chrome prefers the SVG when one is offered, and an
         `.ico` remains the one thing every browser will ask for by name at
         /favicon.ico whether or not it is linked. All of these are generated
         by `npm run icons` — see scripts/metalmark-mark.mjs.

         No `<link rel="manifest">` here on purpose: vite-plugin-pwa injects it
         from the manifest in vite.config.ts, and a hand-written one would be a
         second source of truth for the same file. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MetalMark Money</title>
    <script>
      /*
       * Set the theme before first paint. This is inline and synchronous on
       * purpose: any deferred script (a module, a React effect) runs after the
       * browser has painted, which is exactly the flash of wrong theme this
       * exists to prevent.
       *
       * Keep the storage key in step with THEME_KEY in src/theme/theme.ts. The
       * theme module is the owner of this logic once the app is running; this is
       * a deliberate duplicate of a dozen lines, because the one thing it cannot
       * do is wait for the module.
       *
       * Wrapped in try/catch because localStorage throws in a private window —
       * and a thrown error here would leave the app unstyled rather than merely
       * on the default theme.
       */
      (function () {
        try {
          var stored = localStorage.getItem("metalmark-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* Not fatal: no class means the light default in index.css stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

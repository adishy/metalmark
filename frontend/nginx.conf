# The production frontend: the built SPA, and the API beside it.
#
# Installed as `/etc/nginx/conf.d/default.conf` by the `prod` stage of the
# Dockerfile. One server block, so it replaces the image's stock site wholesale.
#
# The API is proxied from here rather than split off in Caddy, which is where
# ARCHITECTURE §1 draws the fork. The reason is that the *browser* then has one
# origin and this container has one job: `client.ts` asks for `/api/...` on
# whatever origin served the page, exactly as it does in dev through Vite's proxy,
# and nothing anywhere needs CORS or an absolute API URL baked into the bundle.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Body size, and it has to clear the API's own ceiling or it silently
    # overrides it: `portability.MAX_IMPORT_BYTES` accepts a 64 MiB household
    # import, and this limit is checked *before* the request reaches the API. Set
    # below it, the largest import the app claims to support fails at the proxy
    # with nginx's HTML error page, and the API never gets to say why. The
    # headroom over 64 is multipart's own envelope.
    client_max_body_size 96m;

    # Vite's output directory. Every name in it carries a content hash, so a
    # given URL's bytes never change and a far-future cache is honest. `^~` keeps
    # the regex locations below from getting a look at it.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Workbox's runtime chunk — `sw.js` imports it — and it lands at the root
    # rather than under /assets/. Also content-hashed, so also immutable.
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The two files that must never be stale, plus the notification handler.
    #
    # `index.html` names the current asset hashes; cached, it pins the app to a
    # build whose files are gone. `sw.js` is the service worker itself — a
    # browser that caches it keeps running the old worker *and* the old precache
    # manifest until the entry expires, which turns a deploy into a puzzle whose
    # symptom is "the fix did not ship". `no-cache` means revalidate, not "do not
    # store": the browser asks, nginx answers 304, and the cost is one round trip
    # on a file that only changes on deploy. `sw-notify.js` is imported into the
    # worker by `importScripts`, which *does* respect the HTTP cache — so a stale
    # copy of it would outlive the fix to the notification handler it installs.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /sw-notify.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API. `proxy_pass` with a trailing slash strips the prefix, so
    # `/api/transactions` arrives at the API as `/transactions` — the routes are
    # what they are, and ADR-0001 keeps `/api` a property of the frontend's door
    # rather than of the API's surface.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto is deliberately not set here: Caddy has already
        # written it from the real client connection, and `$scheme` would
        # overwrite that truth with `http` — the scheme of this hop, which is the
        # one thing the header is never asking about.
    }

    # The API's readiness probe, passed through so a deployment can be asked for
    # its health without a session. Without this it would fall to the SPA below
    # and answer 200 with a copy of index.html, which is the one answer a health
    # check must never be able to give. `/healthz` fails closed in the app — it
    # checks the app role, not just that the process is up — so a 200 here means
    # the database is reachable and migrated.
    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    # Everything else is the SPA, and its routes are client-side: `/transactions`
    # and `/admin` are not files. `try_files` handing a miss to index.html is what
    # makes a deep link or a reload work; the internal redirect re-runs location
    # matching, so the no-cache above still applies to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/manifest+json image/svg+xml;
}

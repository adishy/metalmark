      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="0.45" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

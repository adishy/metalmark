            format: uuid
          - type: 'null'
          title: Category Id
        category_name:
          type: string
          title: Category Name
        total:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total
      type: object
      required:
      - category_id
      - category_name
      - total
      title: CategorySpendRow
    CsvCommitOut:
      properties:
        inserted:
          type: integer
          title: Inserted
        skipped:
          type: integer
          title: Skipped
        suspects:
          type: integer
          title: Suspects
        errors:
          items:
            $ref: '#/components/schemas/CsvRowError'
          type: array
          title: Errors
          default: []
      type: object
      required:
      - inserted
      - skipped
      - suspects
      title: CsvCommitOut
      description: 'The three counts are the contract; ``errors`` is the row-level extension.


        ``suspects`` is a subset of ``inserted`` — those rows landed, flagged

        ``needs_review`` as possible duplicates. ``inserted + skipped + len(errors)``

        equals the number of non-blank data rows in the file.'
    CsvPreviewOut:
      properties:
        headers:
          items:
            type: string
          type: array
          title: Headers
        sample:
          items:
            items:
              type: string
            type: array
          type: array
          title: Sample
        suggested:
          additionalProperties:
            anyOf:
            - type: string
              enum:
              - date
              - amount
              - debit
              - credit

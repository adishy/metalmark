          title: Type
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        subtype:
          anyOf:
          - type: string
          - type: 'null'
          title: Subtype
        institution:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution
        current_balance:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Current Balance
          default: '0'
        balance_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Balance Date
        owner_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Id
      type: object
      required:
      - name
      - type
      - currency
      title: AccountCreate
    AccountOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        currency:
          type: string
          title: Currency
        subtype:
          anyOf:
          - type: string
          - type: 'null'
          title: Subtype
        institution:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution
        current_balance:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Current Balance
        balance_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Balance Date
        is_asset:
          type: boolean
          title: Is Asset
        owner_id:
          type: string
          format: uuid
          title: Owner Id
        is_manual:
          type: boolean
          title: Is Manual
        is_hidden:

    CashFlowPoint:
      properties:
        date:
          type: string
          format: date
          title: Date
        income:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Income
        expense:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Expense
        net:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Net
      type: object
      required:
      - date
      - income
      - expense
      - net
      title: CashFlowPoint
      description: 'One bucket of the series.


        ``date`` is the bucket''s first day **within the window**, not the period it

        belongs to: a window opening on 15 March labels its first monthly bar

        `2026-03-15`, which is a day the report actually covers. Naming the unclipped

        period (`2026-03-01`) would put a date in the payload that lies outside the

        window the same payload echoes — exactly the confusion this field replaced.'
    CashFlowSankey:
      properties:
        base_currency:
          type: string
          title: Base Currency
        start:
          type: string
          format: date
          title: Start
        end:
          type: string
          format: date
          title: End
        income:
          items:
            $ref: '#/components/schemas/CashFlowSankeyRow'
          type: array
          title: Income
        expense:
          items:
            $ref: '#/components/schemas/CashFlowSankeyRow'
          type: array
          title: Expense
        total_income:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Income
        total_expense:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Expense
        net:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Net
        attribution:
          type: string
          title: Attribution
          default: row
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          default: []
      type: object
      required:
      - base_currency
      - start
      - end
      - income
      - expense
      - total_income
      - total_expense
      - net
      title: CashFlowSankey
      description: 'The window''s cash flow as the two sides of one graph.


        ``income`` and ``expense`` are **rows, not nodes and links**: grouping is the

        arithmetic, and the picture''s shape follows from it. Sending the shape would

        put a layout decision on the wire where no reader could check it.


        Every ``total`` here — the rows and the two figures below alike — is a

        magnitude, and ``net`` is the only signed number. That is why ``total_expense``

        is positive where ``CashFlowPoint.expense`` is not: a Sankey encodes direction

        by which side a node sits on, and a value negative on both sides is not a graph

        anyone can draw or read.


        ``total_income`` and ``total_expense`` are the sums of the rows above them, so

        the picture balances **by construction** — the left side plus ``net`` equals

        the right side, with no residual to reconcile and no rounding gap to explain.'
    CashFlowSankeyRow:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        category_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Category Id
        total:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total
      type: object
      required:
      - key
      - label
      - category_id
      - total
      title: CashFlowSankeyRow
      description: 'One node of the cash-flow graph — where a group of entries came from, or went.


        ``total`` is a **magnitude**: always positive, because the list this row is in

        carries the direction (see ``CashFlowSankey``).'
    CashFlowSeries:
      properties:
        base_currency:
          type: string
          title: Base Currency
        start:
          type: string
          format: date
          title: Start
        end:
          type: string
          format: date
          title: End
        granularity:
          type: string
          enum:

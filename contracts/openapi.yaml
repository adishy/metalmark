components:
  schemas:
    AccountCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        type:
          type: string
          pattern: ^(depository|credit|investment|loan|other)$
          title: Type
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        subtype:
          anyOf:
          - type: string
          - type: 'null'
          title: Subtype
        institution:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution
        current_balance:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Current Balance
          default: '0'
        balance_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Balance Date
        owner_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Id
      type: object
      required:
      - name
      - type
      - currency
      title: AccountCreate
    AccountOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        currency:
          type: string
          title: Currency
        subtype:
          anyOf:
          - type: string
          - type: 'null'
          title: Subtype
        institution:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution
        current_balance:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Current Balance
        balance_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Balance Date
        is_asset:
          type: boolean
          title: Is Asset
        owner_id:
          type: string
          format: uuid
          title: Owner Id
        is_manual:
          type: boolean
          title: Is Manual
        is_hidden:
          type: boolean
          title: Is Hidden
        stale_since:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Stale Since
      type: object
      required:
      - id
      - name
      - type
      - currency
      - subtype
      - institution
      - current_balance
      - balance_date
      - is_asset
      - owner_id
      - is_manual
      - is_hidden
      title: AccountOut
    AccountUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Name

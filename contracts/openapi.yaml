      - delta_net_worth
      - net_cash_flow
      - currency_revaluation
      - market_appreciation
      - unexplained
      title: NetWorthSeries
      description: 'The net-worth series and the reconciliation of its change (ADR-0032).


        ``extra="forbid"`` is load-bearing rather than tidy: the API builds this from

        the service''s dict, and Pydantic''s default is to *drop* a key it does not know

        about — so a term added to the identity but forgotten here would vanish from the

        response with nothing failing, and the terms that did land would no longer add

        up to the delta. Forbidding extras turns that into a loud error instead.'
    NotificationOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        run_id:
          type: string
          format: uuid
          title: Run Id
        ts:
          type: string
          format: date-time
          title: Ts
        connection_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Connection Id
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
      type: object
      required:
      - id
      - run_id
      - ts
      - connection_id
      - title
      - body
      title: NotificationOut
      description: 'One notice the worker decided to send, as the browser shows it (ADR-0037).


        Flattened to a title and a body because that is the shape a notification has,

        and composed **server-side** (``Trouble.notice``) because the decision that

        produced it lives in the worker: a browser allowed to build its own wording

        from raw fields is a browser that can be persuaded to put an amount in it.

        Both strings were sanitized at write time and are returned as they were stored.


        ``connection_id`` is what the browser passes as the notification''s ``tag``, so

        a repeat about one connection replaces the standing notification rather than

        stacking a column of them. It is nullable, and deliberately not a 500 when it

        is: a connection disconnected since the failure leaves its notices behind,

        which is correct — the notice is history and the failure still happened.'

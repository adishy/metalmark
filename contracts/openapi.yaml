          - type: string
          - type: 'null'
          title: Merchant
        category_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Category Id
        owner_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Id
        is_pending:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Pending
        is_hidden:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Hidden
        review_status:
          anyOf:
          - type: string
            pattern: ^(needs_review|reviewed|ignored)$
          - type: 'null'
          title: Review Status
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        tag_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Tag Ids
      type: object
      title: TransactionUpdate
      description: 'Absent means "no change"; explicit null means "clear" for the nullable fields.


        For the rest null is a client bug, and saying so beats ignoring it — silently

        dropping a null is how a PATCH appears to succeed while changing nothing.'
    TransferCandidateOut:
      properties:
        transaction:
          $ref: '#/components/schemas/TransactionOut'
        days_apart:
          type: integer
          title: Days Apart
        fx_cost_base:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Fx Cost Base
        within_tolerance:
          type: boolean
          title: Within Tolerance
      type: object
      required:
      - transaction
      - days_apart
      - fx_cost_base
      - within_tolerance
      title: TransferCandidateOut
      description: 'One possible counterpart leg, with the price of pairing it.


        ``fx_cost_base`` is what the transfer group''s ``fx_cost_base`` would become if

        the user committed — Σ base_amount of the two legs. So it is ``None`` for a

        clean same-currency pair (the legs cancel exactly) and the real spread for a

        cross-currency one (ADR-0018). It is computed by the same helper that

        ``link_transfer`` stores, so the number shown before linking is the number

        that lands on the group after it.


        ``within_tolerance`` says the pair''s base amounts cancel inside the matching

        tolerance. False is not a refusal: ADR-0018 keeps explicit user linking as the

        override, so the row is still offered — this flag plus the residual are how

        the UI tells "the bank''s rate differed slightly" apart from "that is probably

        not the other leg at all".'
    TransferCandidatesOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TransferCandidateOut'
          type: array
          title: Items
      type: object
      required:
      - items
      title: TransferCandidatesOut
    TransferDetailOut:
      properties:
        transfer_group_id:
          type: string
          format: uuid
          title: Transfer Group Id
        matched_by:
          type: string
          title: Matched By
        fx_cost_base:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Fx Cost Base
        legs:
          items:
            $ref: '#/components/schemas/TransactionOut'
          type: array
          title: Legs
      type: object
      required:
      - transfer_group_id
      - matched_by
      - fx_cost_base
      - legs
      title: TransferDetailOut
      description: 'A linked transfer read back whole — the group, and both legs with it.


        A transaction knows only its ``transfer_group_id``, so this is the only way a

        detail view can show the *other* leg. ``fx_cost_base`` is part of that read

        rather than something the client derives, because ADR-0018 requires the cost

        of a cross-currency transfer to be shown: leaving it out would make hiding it

        the path of least resistance.'
    TransferLink:
      properties:
        from_txn_id:
          type: string
          format: uuid
          title: From Txn Id
        to_txn_id:
          type: string
          format: uuid
          title: To Txn Id
      type: object
      required:
      - from_txn_id
      - to_txn_id
      title: TransferLink
      description: Manually link two existing transactions as a transfer (ADR-0008/0018).
    TransferOut:
      properties:
        transfer_group_id:
          type: string
          format: uuid
          title: Transfer Group Id
        matched_by:
          type: string
          title: Matched By
        fx_cost_base:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Fx Cost Base
        txn_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Txn Ids
      type: object
      required:
      - transfer_group_id
      - matched_by
      - fx_cost_base
      - txn_ids
      title: TransferOut
    UserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          format: email
          title: Email
        display_name:
          type: string
          title: Display Name
        is_admin:
          type: boolean
          title: Is Admin
      type: object
      required:
      - id
      - email
      - display_name
      - is_admin
      title: UserResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

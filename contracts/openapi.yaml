    ConnectionClaim:
      properties:
        setup_token:
          type: string
          maxLength: 4096
          minLength: 1
          title: Setup Token
      type: object
      required:
      - setup_token
      title: ConnectionClaim
      description: '``POST /connections/claim`` — the only route that accepts a credential.


        The token is a body *field*, not a query parameter: query strings land in

        access logs, in ``Referer`` headers, and in browser history, and a single-use

        credential should appear in none of them.


        Never echoed back. ``ConnectionOut`` has no field for it, so a response

        cannot repeat it even by accident.'
    ConnectionDefaults:
      properties:
        sync_interval_minutes:
          type: integer
          title: Sync Interval Minutes
          default: 360
        sync_interval_min_minutes:
          type: integer
          title: Sync Interval Min Minutes
          default: 120
        sync_interval_max_minutes:
          type: integer
          title: Sync Interval Max Minutes
          default: 10080
      type: object
      title: ConnectionDefaults
      description: 'The cadence floor, ceiling and default, so the UI''s slider needs no

        hard-coded copy of them.


        Its own route rather than a field on the connection list: it is a property of

        the *schema*, not of the household — the same three integers for every request

        — and folding it into a list response would repeat them per connection and

        invite a client to read the bounds off whichever row it happened to get.'
    ConnectionOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        provider:
          type: string
          title: Provider
        org_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Name
        status:
          type: string
          title: Status
        last_synced_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Synced At
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        is_enabled:
          type: boolean
          title: Is Enabled
        sync_interval_minutes:
          type: integer
          title: Sync Interval Minutes
        next_sync_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Sync At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - provider
      - org_name
      - status
      - last_synced_at
      - last_error
      - is_enabled
      - sync_interval_minutes
      - next_sync_at
      - created_at
      title: ConnectionOut
      description: 'A connection as the dashboard and the settings tab see it.


        ``status`` and ``is_enabled`` are separate on purpose and the client must

        render them as two things: health (``ok`` / ``auth_error`` / ``error``) is

        what the *bank* is doing, and ``is_enabled`` is what the *user* did. A paused

        connection showing "auth error" is a paused connection that also needs

        reconnecting, and collapsing the two into one badge would lose one of them.'
    ConnectionUpdate:
      properties:
        is_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Enabled
        sync_interval_minutes:
          anyOf:
          - type: integer
            maximum: 10080.0
            minimum: 120.0
          - type: 'null'
          title: Sync Interval Minutes
      type: object
      title: ConnectionUpdate
      description: 'The two knobs the control panel turns.


        ``is_enabled`` is pause/resume and ``sync_interval_minutes`` is the cadence.

        Absent means no change; neither has a "clear" semantics, because a nullable

        pause flag or a nullable interval would both need a third state to mean

        "inherit", and the columns give each exactly one meaning.'
    CsvCommitOut:
      properties:
        inserted:
          type: integer
          title: Inserted
        skipped:
          type: integer
          title: Skipped
        suspects:
          type: integer
          title: Suspects
        errors:
          items:
            $ref: '#/components/schemas/CsvRowError'
          type: array
          title: Errors
          default: []
      type: object
      required:
      - inserted
      - skipped
      - suspects
      title: CsvCommitOut
      description: 'The three counts are the contract; ``errors`` is the row-level extension.


        ``suspects`` is a subset of ``inserted`` — those rows landed, flagged

        ``needs_review`` as possible duplicates. ``inserted + skipped + len(errors)``

        equals the number of non-blank data rows in the file.'
    CsvPreviewOut:
      properties:
        headers:
          items:
            type: string
          type: array
          title: Headers
        sample:

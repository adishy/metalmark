      title: TransactionUpdate
      description: 'Absent means "no change"; explicit null means "clear" for the nullable fields.


        For the rest null is a client bug, and saying so beats ignoring it — silently

        dropping a null is how a PATCH appears to succeed while changing nothing.'
    TransferCandidateOut:
      properties:
        transaction:
          $ref: '#/components/schemas/TransactionOut'
        days_apart:
          type: integer
          title: Days Apart
        fx_cost_base:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Fx Cost Base
        within_tolerance:
          type: boolean
          title: Within Tolerance
      type: object
      required:
      - transaction
      - days_apart
      - fx_cost_base
      - within_tolerance
      title: TransferCandidateOut
      description: 'One possible counterpart leg, with the price of pairing it.


        ``fx_cost_base`` is what the transfer group''s ``fx_cost_base`` would become if

        the user committed — Σ base_amount of the two legs. So it is ``None`` for a

        clean same-currency pair (the legs cancel exactly) and the real spread for a

        cross-currency one (ADR-0018). It is computed by the same helper that

        ``link_transfer`` stores, so the number shown before linking is the number

        that lands on the group after it.


        ``within_tolerance`` says the pair''s base amounts cancel inside the matching

        tolerance. False is not a refusal: ADR-0018 keeps explicit user linking as the

        override, so the row is still offered — this flag plus the residual are how

        the UI tells "the bank''s rate differed slightly" apart from "that is probably

        not the other leg at all".'
    TransferCandidatesOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TransferCandidateOut'
          type: array
          title: Items
      type: object
      required:
      - items
      title: TransferCandidatesOut
    TransferDetailOut:
      properties:
        transfer_group_id:
          type: string
          format: uuid
          title: Transfer Group Id
        matched_by:
          type: string
          title: Matched By
        fx_cost_base:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Fx Cost Base
        legs:
          items:
            $ref: '#/components/schemas/TransactionOut'
          type: array
          title: Legs
      type: object
      required:
      - transfer_group_id
      - matched_by
      - fx_cost_base
      - legs
      title: TransferDetailOut
      description: 'A linked transfer read back whole — the group, and both legs with it.


        A transaction knows only its ``transfer_group_id``, so this is the only way a

        detail view can show the *other* leg. ``fx_cost_base`` is part of that read

        rather than something the client derives, because ADR-0018 requires the cost

        of a cross-currency transfer to be shown: leaving it out would make hiding it

        the path of least resistance.'

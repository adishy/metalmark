    RuleOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        priority:
          type: integer
          title: Priority
        enabled:
          type: boolean
          title: Enabled
        conditions:
          $ref: '#/components/schemas/RuleConditions-Output'
        actions:
          $ref: '#/components/schemas/RuleActions'
        created_at:
          type: string
          format: date-time

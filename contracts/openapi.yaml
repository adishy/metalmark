openapi: 3.1.0
info:
  title: MetalMark API
  description: Self-hosted household personal finance. LAN/VPN only.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      description: 'Readiness: 503 while the database is unreachable, 200 once it answers.'
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
        '503':
          description: The database is unreachable or the app role cannot authenticate. The process is
            up but the stack is not usable — most often because `alembic upgrade head` has not been run
            against this database.
  /checks:
    get:
      tags:
      - checks
      summary: Run Checks
      description: 'The data checks, run now for this household — the same ones the worker runs

        on every start (ADR-0047), with the accounts behind each finding.'
      operationId: run_checks_checks_get
      parameters:
      - name: metalmark_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Metalmark Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecksOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/signup:
    post:
      tags:
      - auth
      summary: Signup
      operationId: signup_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:

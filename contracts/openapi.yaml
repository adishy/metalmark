                  $ref: '#/components/schemas/OwnerOut'
                title: Response List Owners Owners Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - owners
      summary: Create Owner
      description: Create an owner. Household owner role required.
      operationId: create_owner_owners_post
      parameters:
      - name: metalmark_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Metalmark Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /owners/{owner_id}:
    patch:
      tags:
      - owners
      summary: Update Owner
      description: Rename or reorder an owner. Household owner role required.
      operationId: update_owner_owners__owner_id__patch
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Owner Id
      - name: metalmark_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Metalmark Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - owners
      summary: Delete Owner
      description: 'Delete an owner, moving its rows to ``reassign_to`` (default: Shared).


        Owner-only: the operation silently re-attributes existing ledger history, which

        is a household-shape decision, not an everyday edit.'
      operationId: delete_owner_owners__owner_id__delete
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Owner Id
      - name: reassign_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Reassign To
      - name: metalmark_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Metalmark Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDeleteResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:

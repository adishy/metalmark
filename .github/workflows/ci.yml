name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches and PRs, where only the tip matters.
  #
  # Do NOT cancel on `main`. Every commit there is supposed to be independently
  # verified, and `cancel-in-progress` quietly destroys that: push two commits a
  # minute apart and the first run is killed before it reports. That is not
  # hypothetical — the admin-panel fix was pushed and its run was cancelled by
  # the next push, so the only commit in the batch containing code was never
  # checked by CI at all, and three doc commits after it never got a run either.
  # A red main that *looks* green because the run was cancelled is the worst
  # outcome this file can produce, and it is worse than a slow queue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The runner is pinned rather than `ubuntu-latest` deliberately: `latest` migrates to
# Ubuntu 26 on 2026-10-19, and a runner image change is exactly the kind of thing that
# turns a green suite red for reasons unrelated to the code. Playwright's baselines are
# pinned to an image for the same reason. Move this deliberately, not by surprise.
#
# The actions are on majors that declare `runs.using: node24`. The node20 ones still
# run (GitHub force-runs them on node24) but warn on every job, and the deprecation
# ends with them removed.
jobs:
  # --------------------------------------------------------------------------
  # Backend: lint + pytest against a real Postgres (tests recreate metalmark_test)
  # --------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16
        env:
          # Owner role must be a superuser so tests/conftest.py can CREATE DATABASE.
          POSTGRES_USER: metalmark
          POSTGRES_PASSWORD: metalmark_ci_password
          POSTGRES_DB: metalmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metalmark -d metalmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      METALMARK_TEST_PG_HOST: localhost
      METALMARK_TEST_PG_PORT: "5432"
      POSTGRES_USER: metalmark
      POSTGRES_PASSWORD: metalmark_ci_password
      POSTGRES_DB: metalmark
      METALMARK_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # v7, not the newest release: setup-uv stopped publishing floating major tags
        # after v7, so `@v10` fails to resolve outright ("unable to find version v10")
        # even though v10.1.0 exists as a tag. v7 is node24, which is the reason for
        # touching this at all. Bumping past it means pinning an exact version.
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies (from uv.lock)
        working-directory: backend
        # uv sync provisions the right Python, installs the frozen deps + dev
        # extra, and installs the project itself into backend/.venv.
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Run backend tests (pytest)
        working-directory: backend
        run: uv run pytest -q

  # --------------------------------------------------------------------------
  # Frontend: type-check, unit tests (vitest), production build
  # --------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      # DESIGN.md §8's conformance greps. They were prose in the spec and had
      # never been run; the tree passes them today, so this is a ratchet rather
      # than a fix. Note `npm run lint` is NOT this — see the README.
      - name: Design-system conformance (DESIGN.md §8)
        run: npm run lint:design

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------------
  # Contract check: live API conforms to the OpenAPI spec (schemathesis) and
  # protected endpoints are 401 when unauthenticated. Pragmatic scope.
  # --------------------------------------------------------------------------
  contract:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: metalmark
    steps:
      - uses: actions/checkout@v7

      - name: Create runtime secret (Fernet key)
        run: |
          mkdir -p secrets
          openssl rand -base64 32 | tr '+/' '-_' > secrets/metalmark_secret_key

      - name: Start API + DB
        run: docker compose up -d --build db api

      # Nothing migrates a fresh volume on its own: the api container runs uvicorn
      # and nothing else, and there is no entrypoint that migrates (that is
      # deliberate — migrations are always explicit). /healthz below now reports
      # 503 until the database is usable, so this has to come first.
      - name: Migrate database
        run: docker compose run --rm api alembic upgrade head

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then
              echo "api healthy"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs api >&2
          exit 1

      - name: Schemathesis conformance (/healthz)
        run: >-
          docker compose exec -T api schemathesis run
          http://localhost:8000/openapi.json
          --include-path /healthz --max-examples 5 --checks all

      # GET only, deliberately: an unauthenticated request to a POST route has no
      # body to send here, and whether it answers 401 or 422 is a detail of
      # FastAPI's dependency ordering rather than a security property. The
      # multipart routes are covered in-process instead, where a body is easy to
      # supply (tests/integration/test_imports.py) — /import is not listed because
      # its routes are all POSTs and a GET there is a 404, not a 401. /export is
      # listed and /export/transactions.csv is not: the CSV route takes a required
      # query parameter, so an unauthenticated GET without one is a 422 before it
      # is a 401.
      - name: Protected endpoints require auth (401)
        run: |
          fail=0
          for path in /accounts /transactions /categories /reports/net-worth /owners /household /rules /fx-rates /connections /connections/runs /connections/jobs /connections/notifications /export; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000${path}")
            echo "GET ${path} -> ${code}"
            if [ "$code" != "401" ]; then
              echo "expected 401 for ${path}, got ${code}" >&2
              fail=1
            fi
          done
          exit $fail

      # contracts/openapi.yaml is what the frontend mocks (and any generated
      # client) are built against, but nothing compared it to the spec the API
      # actually serves — it had already drifted silently. Compare them
      # semantically (YAML and JSON parse to the same structure), so key order
      # and formatting are irrelevant and only real contract changes fail.
      # The check lives in scripts/openapi_drift_check.py rather than inline here,
      # so `scripts/verify.sh contract` runs the identical thing locally.
      - name: OpenAPI drift check (contracts/openapi.yaml vs live /openapi.json)
        run: |
          docker compose cp contracts/openapi.yaml api:/tmp/checked-openapi.yaml
          docker compose cp scripts/openapi_drift_check.py api:/tmp/openapi_drift_check.py
          docker compose exec -T api python /tmp/openapi_drift_check.py /tmp/checked-openapi.yaml

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --------------------------------------------------------------------------
  # Restore drill: back the database up, restore it into a scratch database, and
  # compare. A backup script nobody has restored from is a belief, not a
  # capability — so the drill is a gate, and this is the only place it runs
  # against a database that has migrations and demo data in it rather than
  # whatever a developer's volume happens to hold.
  # --------------------------------------------------------------------------
  drill:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: metalmark
    steps:
      - uses: actions/checkout@v7

      - name: Create runtime secret (Fernet key)
        run: |
          mkdir -p secrets
          openssl rand -base64 32 | tr '+/' '-_' > secrets/metalmark_secret_key

      - name: Start API + DB
        run: docker compose up -d --build db api

      # The drill compares the two databases row for row, and a database with no
      # rows in it compares equal to anything. Migrating and seeding first is what
      # makes the comparison mean something — so this seeds the *demo* ledger, not
      # the bare bootstrap: the demo path writes through the real services, and a
      # drill run over the four tables a fresh household fills would not notice a
      # restore that quietly dropped `transactions`.
      - name: Migrate database
        run: docker compose run --rm api alembic upgrade head

      - name: Seed demo data (so there are rows to compare)
        run: >-
          docker compose run --rm
          -e METALMARK_SEED_EMAIL=owner@example.com
          -e METALMARK_SEED_PASSWORD=devpassword123
          -e METALMARK_SEED_HOUSEHOLD=Home
          api python -m app.seed --demo

      # The drill generates a throwaway key when METALMARK_BACKUP_KEY is unset and
      # uses the real one when it is, so this job needs no secret: the archive it
      # writes is decrypted by the key that wrote it and is deleted with the
      # scratch database on the way out.
      - name: Restore drill (dump, encrypt, restore into a scratch database)
        run: ./scripts/restore_drill.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --------------------------------------------------------------------------
  # Deployment: boot docker-compose.prod.yml from an empty volume and probe it.
  # The only job that builds the frontend for production, serves it the way
  # ARCHITECTURE §1 draws, and therefore the only one that can reach the service
  # worker — which is what makes a desktop notification possible at all, and
  # which no gate could reach before (ADR-0037's gap, closed by ADR-0038).
  # --------------------------------------------------------------------------
  prod:
    runs-on: ubuntu-24.04
    env:
      # Its own project, so it stands up beside anything else rather than over
      # it — and never the dev project, whose teardown is a volume drop.
      PROD_PROJECT_NAME: metalmark-prod
    steps:
      - uses: actions/checkout@v7

      - name: Create runtime secret (Fernet key)
        run: |
          mkdir -p secrets
          openssl rand -base64 32 | tr '+/' '-_' > secrets/metalmark_secret_key

      # The gate itself rather than a copy of its steps: `scripts/verify.sh` is
      # what a developer runs, and the whole point of it is that a green run here
      # and a green run there mean the same thing. It tears its own project down,
      # on the failure path too.
      - name: Boot the deployment and check it
        run: ./scripts/verify.sh prod

  # --------------------------------------------------------------------------
  # E2E: bring up the full stack, seed, run Playwright against it (Chromium).
  # --------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: metalmark
      # Makes `sync.spec.ts` runnable at all. Without it the claim endpoint calls
      # the real bridge, so the sync vertical could only be exercised by a human
      # with a real bank credential — in a job that must never hold one, and whose
      # results would then be real financial data in a CI log. The fake is refused
      # outright when METALMARK_ENV is not test/dev, and this stack is `dev`.
      METALMARK_SIMPLEFIN_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7

      - name: Create runtime secret (Fernet key)
        run: |
          mkdir -p secrets
          openssl rand -base64 32 | tr '+/' '-_' > secrets/metalmark_secret_key

      - name: Start full stack
        run: docker compose up -d --build

      # The api container runs uvicorn and nothing else — there is no entrypoint
      # script — so nothing migrates a fresh volume. Without this step the tables
      # do not exist *and* the metalmark_app role does not either (migration 0001
      # creates it), so the seed dies on `password authentication failed for user
      # "metalmark_app"` — an error that points nowhere near the real cause. It
      # must also precede the health wait below, which now fails closed.
      - name: Migrate database
        run: docker compose run --rm api alembic upgrade head

      # The top risk in this project is the ORM metadata and the migrated schema
      # drifting apart, and until now nothing checked. `alembic check` compares a
      # freshly-migrated database against the live metadata and fails on any
      # difference, which is exactly the drift a fresh `create_all` would hide.
      - name: Schema matches the ORM metadata (alembic check)
        run: docker compose run --rm api alembic check

      - name: Wait for API + web
        run: |
          ok() { curl -fsS "$1" >/dev/null; }
          for i in $(seq 1 60); do
            if ok http://localhost:8000/healthz && ok http://localhost:5173; then
              echo "stack up"; exit 0
            fi
            sleep 2
          done
          echo "stack did not come up" >&2
          docker compose logs >&2
          exit 1

      - name: Seed demo data (idempotent)
        run: >-
          docker compose run --rm
          -e METALMARK_SEED_EMAIL=owner@example.com
          -e METALMARK_SEED_PASSWORD=devpassword123
          -e METALMARK_SEED_HOUSEHOLD=Home
          api python -m app.seed --demo

      - name: Run Playwright (against the compose stack)
        run: >-
          docker run --rm --network ${COMPOSE_PROJECT_NAME}_default
          -e E2E_BASE_URL=http://web:5173 -e CI=1
          -v "${{ github.workspace }}/frontend":/work -w /work
          mcr.microsoft.com/playwright:v1.63.0-noble
          sh -c "npm ci && npx playwright test"

      # After Playwright, deliberately: the walkthrough leaves uncategorized
      # transactions behind, and review.spec.ts drains a queue that they would
      # otherwise inflate. Same stack, same database, real HTTP.
      - name: Walkthrough (M1a paths Playwright does not reach)
        run: |
          docker compose run --rm -T \
            -e WALKTHROUGH_BASE_URL=http://api:8000 \
            -e WALKTHROUGH_EMAIL=owner@example.com \
            -e WALKTHROUGH_PASSWORD=devpassword123 \
            -v "${{ github.workspace }}/scripts":/scripts:ro \
            api python /scripts/walkthrough.py

      - name: Upload Playwright report + diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
